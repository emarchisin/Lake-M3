[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lake-m3"
version = "0.1.0"
requires-python = "==3.12.11"
dependencies = [
    "h5py==3.16.0",
    "matplotlib==3.10.5",
    "numpy==2.2.6",
    "pandas==2.3.1",
    "pyarrow==23.0.1",
    "scipy==1.16.1",
    "seaborn==0.13.2",
    "tqdm==4.67.1",
]
